title: Environment Variable Demo
splash: ../splash.txt

processes:
  # Database with configurable port
  - name: postgres
    command: echo "🐘 PostgreSQL $DB_NAME running on port $DB_PORT" && sleep 1d
    color: blue
    environment:
      DB_PORT: "${DB_PORT:-5431}"
      DB_NAME: ${DB_NAME}

  # Backend API with dynamic configuration
  - name: api
    command: |
      echo "🚀 API Server starting..."
      echo "📡 Listening on port ${API_PORT:-4000}"
      echo "📊 Database: ${DATABASE_URL}"
      echo "🌍 Environment: ${NODE_ENV:-development}"
      echo "✅ Ready to accept connections"
      while true; do
        echo "$(date '+%H:%M:%S') [INFO] Incoming request"
        sleep 3
      done
    color: green
    environment:
      API_PORT: "${API_PORT:-4000}"
      DATABASE_URL: "postgresql://${DB_HOST:-localhost}:${DB_PORT:-5432}/${DB_NAME:-myapp}"
      NODE_ENV: "${NODE_ENV:-development}"
      JWT_SECRET: "${JWT_SECRET}"

  # Frontend with dynamic API URL
  - name: web
    command: |
      echo "⚛️  React App starting..."
      echo "🎨 API URL: ${REACT_APP_API_URL}"
      echo "✅ Compiled successfully!"
      echo ""
      echo "  Local:    http://localhost:${WEB_PORT:-3000}"
      echo ""
      while true; do
        echo "$(date '+%H:%M:%S') [HMR] Updated"
        sleep 10
      done
    color: cyan
    environment:
      WEB_PORT: "${WEB_PORT:-3000}"
      REACT_APP_API_URL: "http://${API_HOST:-localhost}:${API_PORT:-4000}"
      FAST_REFRESH: "true"

  # Worker with user-specific directory
  - name: worker
    command: |
      echo "⚙️  Worker starting..."
      echo "📁 Working directory: $(pwd)"
      echo "👤 User: ${USER}"
      echo "🏠 Home: ${HOME}"
      while true; do
        echo "$(date '+%H:%M:%S') Processing job..."
        sleep 5
      done
    color: yellow
    directory: "${WORK_DIR:-/tmp}"
    environment:
      WORKER_ID: "${HOSTNAME:-worker-1}"
      LOG_LEVEL: "${LOG_LEVEL:-info}"

