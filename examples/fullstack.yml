title: fullstack
splash: ../splash.txt

processes:
  # Database
  - name: postgres
    command: echo "🐘 PostgreSQL running on port 5432" && sleep 1d
    color: blue

  # Backend API
  - name: api
    command: |
      echo "🚀 API Server starting..."
      echo "📡 Listening on http://localhost:4000"
      echo "📊 Database connected"
      echo "✅ Ready to accept connections"
      while true; do
        echo "$(date '+%H:%M:%S') [INFO] Incoming request: GET /api/users"
        sleep 3
        echo "$(date '+%H:%M:%S') [INFO] Query executed in 12ms"
        sleep 2
      done
    color: green
    environment:
      PORT: "4000"
      DATABASE_URL: postgresql://localhost:5432/myapp
      NODE_ENV: development

  # Frontend (React/Next.js)
  - name: web
    command: |
      echo "⚛️  React App starting..."
      echo "🎨 Compiling..."
      sleep 1
      echo "✅ Compiled successfully!"
      echo ""
      echo "  Local:    http://localhost:3000"
      echo "  Network:  http://192.168.1.100:3000"
      echo ""
      while true; do
        echo "$(date '+%H:%M:%S') [HMR] Updated 1 file"
        sleep 10
      done
    color: cyan
    environment:
      PORT: "3000"
      REACT_APP_API_URL: http://localhost:4000
      FAST_REFRESH: "true"

  # TypeScript Type Checker
  - name: tsc
    command: |
      echo "📘 TypeScript compiler starting..."
      echo "🔍 Checking types..."
      sleep 2
      echo "✅ Found 0 errors. Watching for file changes."
      while true; do
        sleep 20
        echo "$(date '+%H:%M:%S') File change detected. Checking..."
        sleep 1
        echo "$(date '+%H:%M:%S') ✅ No errors found"
      done
    color: blue
    autostart: false
